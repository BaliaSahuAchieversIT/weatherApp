<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <style>
        .first{
    
        }
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border: 5px solid black;
            background-color: rgb(25, 26, 25);
            color: white;
            border-radius: 15px;
        }
        .infoContainer{
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .info{
            width: 40%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 5px;
            background-color: rgb(42, 49, 47);
        }
        #search{
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        input{
            height: 50px;
            color: black;
            border-radius: 10px;
            width: 300px;
        }
        #btn{
            background-color: blue;
            width: 100px;
            color: rgb(255, 255, 255);
            border-radius: 10px;
            font-size: larger;
            border: none;
        }
    </style>
</head>
<body>
    <div>
        <div class="container">
            <div id="search">
                 <input type="text" placeholder="Enter the city name" name="" id="inp">
                <button id="btn">Search</button>
            </div>
            <div class="first">
                <p>Current Weather</p>
                <h2 id="city">Hyderabad,IN</h2>
                <h2 id="temp">26.5 C</h2>
                <p id="flt">Feels like 26.5 C</p>
                <h4 id="lr">Light rain</h4>
            </div>
            <div class="infoContainer">
                <div class="info">
                    <p>Rainfall</p>
                    <h3 id="rf">0.12 mm</h3>
                </div>
                <div class="info">
                    <p>Humidity</p>
                    <h3 id="hm">58%</h3>
                </div>
                <div class="info">
                    <p>Cloud Coverage</p>
                    <h3 id="cc">94%</h3>
                </div>
                <div class="info">
                    <p>wind speed</p>
                    <h3 id="sp">3.6 m/s</h3>
                </div>
                <div class="info">
                    <p>Pressure</p>
                    <h3 id="pr">1016 hPa</h3>
                </div>
                 <div class="info">
                    <p>Visibility</p>
                    <h3 id="vi">10km</h3>
                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
